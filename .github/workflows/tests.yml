name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint e análise estática
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        run: composer test:lint

      - name: Static analysis (PHPStan)
        run: composer test:types

  test:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # o toolchain de dev (Pest 3) exige PHP >= 8.2, como no core. O que dá
        # para cobrir no 8.1 está no job `minimum`.
        include:
          - php: '8.2'
            laravel: '10.*'
            testbench: '8.*'
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      # o bridge aceita três majors do Laravel, e cada uma casa com uma major
      # do testbench. Sem fixar as duas, o composer resolveria sempre a mais
      # nova e a matriz provaria uma combinação só.
      - name: Fixar a major do Laravel desta linha
        run: |
          composer require --no-update --dev \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Unit tests (Pest)
        run: composer test:unit

  # O core promete PHP ^8.1 e este pacote acompanha, mas Pest 3 exige 8.2+.
  # Então aqui se valida o que dá sem o toolchain de dev — que é mais do que
  # parece: o que quebra numa versão antiga é sintaxe nova e dependência que
  # subiu o piso, não asserção de teste.
  minimum:
    name: PHP 8.1 (mínimo suportado)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Validar o composer.json
        run: composer validate --strict

      - name: Instalar só as dependências de runtime
        run: composer update --no-dev --prefer-dist --no-interaction --no-progress

      - name: Conferir a sintaxe de src/
        shell: bash
        run: |
          if ! find src -name '*.php' -print0 | xargs -0 -n1 php -l > lint.log 2>&1; then
            grep -v '^No syntax errors detected' lint.log
            exit 1
          fi

          echo "$(grep -c '^No syntax errors detected' lint.log) arquivos sem erro de sintaxe"
